<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descarga Didi Online ✨ Super Kawaii 3D</title>
    
    <!-- Fuentes Kawaii y Futuristas -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --neon-pink: #ff2a85;
            --neon-cyan: #00f2fe;
            --neon-purple: #8a2be2;
            --pastel-pink: #ff9a9e;
            --pastel-blue: #a1c4fd;
            --bg-color: #0b0c10;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #1f0b2e 0%, #0d1b2a 50%, #290a2c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: white;
        }

        .cyber-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(255, 42, 133, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        .glowing-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-1 { width: 300px; height: 300px; background: var(--neon-pink); top: -100px; left: -100px; opacity: 0.5; }
        .orb-2 { width: 400px; height: 400px; background: var(--neon-cyan); bottom: -150px; right: -100px; opacity: 0.4; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: var(--neon-purple); top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.3; }

        .card-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            perspective: 1000px;
            padding: 20px;
        }

        .kawaii-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.5),
                inset 0 0 20px rgba(255,255,255,0.1),
                0 0 30px rgba(255, 42, 133, 0.3),
                0 0 30px rgba(0, 242, 254, 0.3);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        h1 {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 42, 133, 0.5);
            transform: translateZ(50px);
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 30px;
            transform: translateZ(30px);
            font-weight: 600;
        }

        .download-btn {
            display: inline-block;
            text-decoration: none;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: white;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            padding: 15px 40px;
            border-radius: 50px;
            position: relative;
            transform: translateZ(60px);
            transition: all 0.2s ease;
            border: none;
            outline: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Efecto 3D de botón */
            box-shadow: 
                0 10px 0 #9c0d4a,
                0 15px 20px rgba(0,0,0,0.4),
                0 0 20px rgba(255, 42, 133, 0.6);
        }

        .download-btn:active {
            transform: translateZ(60px) translateY(10px);
            box-shadow: 
                0 0 0 #9c0d4a,
                0 5px 10px rgba(0,0,0,0.4),
                0 0 30px rgba(255, 42, 133, 0.8);
        }

        .download-btn i {
            margin-left: 10px;
            animation: bounceDown 2s infinite;
        }

        @keyframes bounceDown {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
            60% { transform: translateY(-3px); }
        }

        .kawaii-animal {
            position: absolute;
            font-size: 3rem;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
            animation: floatAnimal 6s ease-in-out infinite alternate;
            transform-style: preserve-3d;
            z-index: 20;
            pointer-events: none;
        }

        .animal-1 { top: -20px; left: -30px; animation-delay: 0s; }    /* 🐰 */
        .animal-2 { top: 40%; right: -40px; animation-delay: -2s; font-size: 3.5rem; }  /* 🦊 */
        .animal-3 { bottom: -20px; left: 10px; animation-delay: -4s; font-size: 2.8rem; } /* 🐱 */
        .animal-4 { bottom: 20%; left: -50px; animation-delay: -1s; }  /* 🦄 */
        .animal-5 { top: -10px; right: -20px; animation-delay: -3s; }  /* 🐼 */

        @keyframes floatAnimal {
            0% { transform: translateY(0) rotate(-10deg) translateZ(40px); }
            100% { transform: translateY(-20px) rotate(10deg) translateZ(80px); }
        }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .apk-info {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #a1c4fd;
            transform: translateZ(20px);
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .apk-info span {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        @media (max-width: 500px) {
            h1 { font-size: 2.2rem; }
            .download-btn { font-size: 1.2rem; padding: 12px 30px; }
            .kawaii-animal { font-size: 2.5rem; }
            .animal-1 { left: -10px; }
            .animal-2 { right: -10px; }
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="glowing-orb orb-1"></div>
    <div class="glowing-orb orb-2"></div>
    <div class="glowing-orb orb-3"></div>
    <canvas class="sparkles" id="sparkleCanvas"></canvas>

    <div class="card-container" id="tiltCard">
        <!-- Animalitos Kawaii Decorativos -->
        <div class="kawaii-animal animal-1">🐰</div>
        <div class="kawaii-animal animal-2">🦊</div>
        <div class="kawaii-animal animal-3">🐱</div>
        <div class="kawaii-animal animal-4">🦄</div>
        <div class="kawaii-animal animal-5">🐼</div>

        <div class="kawaii-card">
            <h1>Didi Online ✨</h1>
            <p class="subtitle">¡Únete a la aventura Anime! Versión Premium Desbloqueada 💖</p>
            
            <a href="https://www.mediafire.com/file/lithsss8qukiqob/DiDi+online+%E2%9C%A8.apk/file" target="_blank" class="download-btn">
                Descargar <i class="fa-solid fa-cloud-arrow-down"></i>
            </a>

            <div class="apk-info">
                <span><i class="fa-brands fa-android"></i> APK</span>
                <span><i class="fa-solid fa-star"></i> Premium</span>
                <span><i class="fa-solid fa-shield-cat"></i> Seguro</span>
            </div>
        </div>
    </div>

    <script>
        // Efecto 3D Tilt interactivo con el ratón
        const cardContainer = document.getElementById('tiltCard');
        const card = document.querySelector('.kawaii-card');

        cardContainer.addEventListener('mousemove', (e) => {
            const rect = cardContainer.getBoundingClientRect();
            const x = e.clientX - rect.left; // x position within the element
            const y = e.clientY - rect.top;  // y position within the element
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            // Calculate rotation (max 15 degrees)
            const rotateX = ((y - centerY) / centerY) * -15;
            const rotateY = ((x - centerX) / centerX) * 15;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        cardContainer.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            card.style.transition = 'transform 0.5s ease-out';
        });

        cardContainer.addEventListener('mouseenter', () => {
            card.style.transition = 'none'; // Quitar transición al mover para que sea responsivo
        });

        // Sistema de partículas (Estrellas y brillos cayendo/subiendo)
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * -2 - 0.5;
                this.speedX = (Math.random() - 0.5) * 1;
                // Colores pastel variados
                const colors = ['#ff9a9e', '#00f2fe', '#fecfef', '#ffffff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                
                // Si la partícula sale por arriba, reiniciarla abajo
                if (this.y < -10) {
                    this.y = canvas.height + 10;
                    this.x = Math.random() * canvas.width;
                }
            }
            
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Añadir un pequeño brillo extra a algunas partículas
                if(this.size > 2) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }
            }
        }

        function initParticles() {
            particles = [];
            let numberOfParticles = Math.floor((canvas.width * canvas.height) / 10000);
            // Limitar partículas para rendimiento
            if (numberOfParticles > 100) numberOfParticles = 100;
            
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
